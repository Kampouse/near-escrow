# Escrow Verifier Service Configuration
# Copy to verifier.toml and fill in your values

# ─── Identity ────────────────────────────────────────────
verifier_index = 0
secret_key_hex = "YOUR_SECRET_KEY_HEX"
verifier_account_id = "verifier.your-account.testnet"
verifier_did = "did:key:z6Mk..."

# ─── Contracts ───────────────────────────────────────────
escrow_account = "escrow.your-account.testnet"
network = "testnet"
rpc_url = "https://test.rpc.fastnear.com"

# ─── Nostr ───────────────────────────────────────────────
nostr_relays = ["wss://nostr-relay-production.up.railway.app"]
nostr_key_hex = "YOUR_NOSTR_PRIVATE_KEY_HEX"

# ─── Radicle ────────────────────────────────────────────
radicle_home = "~/.radicle"
work_dir = "~/.hermes/verifier/repos"
radicle_seed = true

# ─── Executor ────────────────────────────────────────────
executor_runtime = "docker"
default_image = "python:3.12-slim"
max_timeout_secs = 600
max_memory_mb = 2048

# ─── LLM Judge (for llm_judge verification method) ──────
llm_url = "https://api.openai.com/v1/chat/completions"
llm_api_key = "sk-YOU..._KEY"
llm_model = "gpt-4o-mini"

# ─── Scoring ─────────────────────────────────────────────
consensus_threshold = 2
score_threshold = 50
